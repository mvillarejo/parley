[package]
name = "parley"
version = "0.2.0"
description = "macOS meeting recorder: records your mic and the call audio, transcribes both, and serves transcripts to Claude over MCP"
authors = ["Manuel Villarejo"]
license = "MIT"
edition = "2021"
default-run = "parley"

[lib]
name = "parley_lib"
path = "src/lib.rs"

[[bin]]
name = "parley"
path = "src/main.rs"

[[bin]]
name = "parley-mcp"
path = "src/bin/parley-mcp.rs"

[build-dependencies]
tauri-build = { version = ">=2.6.1, <3", features = [] }

[dependencies]
tauri = { version = ">=2.11.1, <3", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
cpal = "=0.17.3"
anyhow = "1"
url = "2"
crossbeam-channel = "0.5"
arc-swap = "1.7"
dirs = "6"
log = "0.4"
tauri-plugin-log = "2"
open = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.14"
objc2 = "0.5"
block2 = "0.5"
objc2_06 = { package = "objc2", version = "0.6" }
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"

[dev-dependencies]
tempfile = "3"
